[project]
name = "biopharma-hackathon"
version = "0.1.0"
description = "Biopharma hackathon project"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pyarrow>=21.0",
    "rdkit>=2026.3.5",
]

[project.scripts]
genomescreen-ingest = "biopharma_hackathon.genomescreen.ingest:main"
pdkb-build = "biopharma_hackathon.pdkb.build:main"
pdkb-rank = "biopharma_hackathon.pdkb.cli:rank"
pdkb-graph = "biopharma_hackathon.pdkb.cli:graph"

[project.optional-dependencies]
# Placeholder for extras, e.g. `uv sync --extra cuda`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biopharma_hackathon"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
